<!doctype html><html><head><meta charset=utf8><meta name="robots" content="noindex,nofollow,noarchive"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nomad Travel · Plataforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Open+Sans:wght@400;600&display=swap">
<style>
/* Concepto: una plataforma, tres miradas. Dirección (Claudia, escritorio, editorial), Equipo (asesoras, celular de la agencia), Itinerario (documento con la estructura que ya usa la agencia). Paleta salvia y arena de la marca Nomad; serif de documento + sans geométrica como el logotipo. */
:root{
  --bg:#F3F2EC; --surface:#FFFFFF; --surface2:#ECEBE3; --ink:#3C4033; --ink2:#6B705D; --ink3:#8D917C; --line:#E0DFD5;
  --accent:#6B705D; --accent-ink:#FFFFFF; --accent-soft:#E6E8DD; --sand:#DBC6B3; --peach:#FEDFC0; --frame:#24261F;
  --ok:#3E7A5C; --ok-soft:#DDEBE2; --warn:#A8651C; --warn-soft:#F8E7CF; --bad:#A9473A; --bad-soft:#F4DCD6; --info:#4D6178; --info-soft:#E0E6EE;
  --serif:'Jost','Futura','Century Gothic',system-ui,sans-serif;
  --sans:'Jost','Futura','Century Gothic',system-ui,sans-serif;
  --garamond:'EB Garamond',Garamond,'Times New Roman',serif; --opensans:'Open Sans','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
/* Segunda agencia (multi-agencia): solo cambia el acento */
:root.ag-ambar{--accent:#3F5A73;--accent-soft:#E1E8EF;--ink2:#4F6377}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;font-weight:400;padding-inline:20px;padding-block:0 48px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto}
.tnum{font-variant-numeric:tabular-nums}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.muted{color:var(--ink2)}
.serif{font-family:var(--serif)}
h1,h2,h3{font-family:var(--serif);font-weight:300;text-wrap:balance;letter-spacing:-.005em}

/* ---- Barra superior ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-20px;padding:12px 20px}
.topin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:34px;width:auto;display:block}
.brand .wm{font-family:var(--sans);font-weight:300;letter-spacing:.32em;font-size:20px;color:var(--accent)}
.btn{border-radius:99px}
.brand .lg-d{display:none}
.agsel{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 4px 4px 12px;background:var(--surface)}
.agsel select{border:0;background:transparent;padding:4px 6px;font-size:13px;max-width:180px}
.tabs{display:flex;gap:2px;margin-left:auto;background:var(--surface2);border-radius:99px;padding:3px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:99px;font-size:13px;color:var(--ink2);white-space:nowrap;letter-spacing:.02em}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.demo{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:5px 10px;border-radius:99px;white-space:nowrap}
.view{padding-top:28px}

/* ---- Componentes ---- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:3px 10px;border-radius:99px;white-space:nowrap;letter-spacing:.01em}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--info)}.chip.n{background:var(--surface2);color:var(--ink2)}
.chip.plain::before{display:none}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:7px 14px;font-size:12px;letter-spacing:.06em;font-weight:500}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;min-width:0}
.ph{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ph h3{font-size:20px;font-weight:400;letter-spacing:.01em}
.ph .sp{margin-left:auto}
.src{font-size:11px;color:var(--ink3);display:inline-flex;align-items:center;gap:6px}
.src i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}

/* ---- Dirección ---- */
.hero{display:flex;flex-direction:column;margin-bottom:24px}
.hero-img{position:relative;min-height:250px;background-size:cover;background-position:center 62%;display:flex;align-items:flex-end;max-width:100%}
.hero-img::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(36,38,31,.78),rgba(36,38,31,.35) 75%,rgba(36,38,31,.2))}
.hero-tx{position:relative;padding:30px 34px;color:#fff;max-width:640px}
.hero-tx .lbl{color:rgba(255,255,255,.85)}
.hero-tx h1{font-size:clamp(30px,4vw,46px);line-height:1.08;color:#fff;margin-top:6px}
.hero-tx p{margin-top:8px;font-size:16px;font-weight:300;color:rgba(255,255,255,.92)}
.today{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-top:0}
.today div{padding:14px 18px}
.today div+div{border-left:1px solid var(--line)}
.today b{display:block;font-family:var(--serif);font-weight:300;font-size:32px;line-height:1.1}
.today span{font-size:12px;color:var(--ink2);letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px;align-items:start}
.c8{grid-column:span 8}.c4{grid-column:span 4}.c6{grid-column:span 6}.c12{grid-column:span 12}.c7{grid-column:span 7}.c5{grid-column:span 5}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-bottom:6px}
.kpi{padding:2px 16px 0 0}
.kpi+.kpi{padding-left:16px;border-left:1px solid var(--line)}
.kpi .v{font-family:var(--serif);font-size:clamp(20px,1.8vw,25px);white-space:nowrap;font-weight:300;line-height:1.15}
.kpi .d{font-size:12px;color:var(--ink2)}
.kpi .d b{font-weight:500;color:var(--ok)}
.meter{height:4px;background:var(--surface2);border-radius:4px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.chart{width:100%;height:auto;display:block;margin-top:18px}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--ink3)}
.chart .val{fill:var(--ink2);font-size:11px}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--sand)}
.chart .bar.cur{fill:var(--accent)}
.chart .proj{fill:none;stroke:var(--accent);stroke-dasharray:3 3;stroke-width:1}
.tbl-wrap{overflow-x:auto;margin-inline:-6px}
.tbl{width:100%;min-width:760px;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .t{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.tbl .who{font-weight:500}
.tbl .sub{font-size:12px;color:var(--ink2)}
.daysep td{background:var(--surface2);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);padding:6px 8px;font-weight:500}
.route{font-variant-numeric:tabular-nums;letter-spacing:.04em;white-space:nowrap}
.alist{display:flex;flex-direction:column}
.arow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.info{background:var(--info)}.dot.ok{background:var(--ok)}
.arow .h{font-weight:500}
.arow .s{font-size:12.5px;color:var(--ink2)}
.arow .r{font-size:11.5px;color:var(--ink3);text-align:right;white-space:nowrap}
.barsx{display:flex;flex-direction:column;gap:12px}
.bx .row{display:flex;justify-content:space-between;font-size:13px;gap:10px}
.bx .track{height:6px;background:var(--surface2);border-radius:6px;margin-top:5px;overflow:hidden}
.bx .track i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bx .track i.s{background:var(--sand)}
.notes{display:flex;flex-direction:column;gap:12px}
.note{border-left:2px solid var(--sand);padding:2px 0 2px 14px}
.note .h{font-family:var(--serif);font-size:16px;font-weight:400;line-height:1.25}
.note .s{font-size:12.5px;color:var(--ink2)}
.feed{display:flex;flex-direction:column}
.feed li{list-style:none;display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.feed li:last-child{border-bottom:0}
.feed .tm{color:var(--ink3);font-variant-numeric:tabular-nums;font-size:12px}
.trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.trip{border-radius:12px;overflow:hidden;background:var(--surface2);display:flex;flex-direction:column}
.trip .im{aspect-ratio:16/10;background-size:cover;background-position:center;max-width:100%}
.trip .bd{padding:12px 14px 14px}
.trip .h{font-family:var(--serif);font-size:16px;font-weight:400;line-height:1.2}
.trip .s{font-size:12px;color:var(--ink2);margin-top:2px}

/* ---- Equipo ---- */
.team{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:start}
.phone{width:384px;max-width:100%;background:var(--frame);border-radius:46px;padding:10px;box-shadow:0 20px 50px rgba(20,20,10,.22)}
.screen{background:var(--bg);border-radius:37px;overflow:hidden;height:780px;display:flex;flex-direction:column}
.sbar{display:flex;justify-content:space-between;padding:14px 26px 6px;font-size:12.5px;font-weight:500}
.shead{padding:6px 20px 12px}
.shead .hi{font-family:var(--serif);font-weight:300;font-size:26px;line-height:1.1}
.shead .dt{font-size:12px;color:var(--ink2)}
.who-sel{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.who-sel button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:12px}
.who-sel button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sbody{flex:1;overflow-y:auto;padding:4px 16px 16px;scrollbar-width:thin}
.stabs{display:flex;border-top:1px solid var(--line);background:var(--surface)}
.stabs button{flex:1;border:0;background:none;padding:10px 0 14px;font-size:11.5px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;letter-spacing:.04em}
.stabs button[aria-selected="true"]{color:var(--accent);font-weight:500}
.stabs svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.stabs .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:9.5px;font-weight:600;min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.sec{margin:14px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
.mv{background:var(--surface);border-radius:16px;padding:14px 14px 12px;margin-bottom:10px;border:1px solid var(--line)}
.mv .tp{display:flex;align-items:center;gap:10px}
.mv .hr{font-family:var(--serif);font-size:24px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.mv .dir{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.mv .nm{font-weight:500;margin-top:8px}
.mv .ds{font-size:12.5px;color:var(--ink2)}
.mv .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.al{background:var(--surface);border-radius:16px;padding:13px 14px;margin-bottom:10px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.al.is-done{opacity:.62}
.al .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.al .k.bad{color:var(--bad)}.al .k.warn{color:var(--warn)}.al .k.info{color:var(--info)}.al .k.ok{color:var(--ok)}
.al .h{font-weight:500;line-height:1.35}
.al .s{font-size:12.5px;color:var(--ink2)}
.al .act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.al .act a{font-size:12px;color:var(--accent)}
.empty{font-size:13px;color:var(--ink3);padding:18px 6px;text-align:center}
.explain h2{font-size:34px;line-height:1.12;font-weight:300;margin-bottom:10px}
.explain>p{color:var(--ink2);max-width:56ch;margin-bottom:22px}
.rules{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.rule .h{font-weight:500}
.rule .s{font-size:12.5px;color:var(--ink2)}
.rule .v{font-family:var(--serif);font-weight:300;font-size:20px;white-space:nowrap}
.timeline{margin-top:24px}
.tl{position:relative;height:56px;margin-top:10px}
.tl .ax{position:absolute;left:0;right:0;top:26px;border-top:1px solid var(--line)}
.tl .mk{position:absolute;top:18px;transform:translateX(-50%);text-align:center;font-size:11px;color:var(--ink2);white-space:nowrap}
.tl .mk i{display:block;width:12px;height:12px;border-radius:50%;margin:2px auto 6px;background:var(--surface);border:2px solid var(--ink3)}
.tl .mk.on i{background:var(--accent);border-color:var(--accent)}
.tl .mk.fl i{background:var(--ink);border-color:var(--ink);border-radius:2px}

/* ---- Ajustes ---- */
.set{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.fld{display:flex;flex-direction:column;gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
.fld:last-child{border-bottom:0}
.fld .h{font-weight:500}
.fld .s{font-size:12.5px;color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px;background:var(--surface2);width:max-content;max-width:100%;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:99px;padding:6px 14px;font-size:13px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chk{display:flex;align-items:center;gap:10px;font-size:13.5px}
.tg{width:40px;height:23px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.tg[aria-pressed="true"]{background:var(--accent)}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .15s}
.tg[aria-pressed="true"]::after{transform:translateX(17px)}
.tg:disabled{opacity:.45;cursor:not-allowed}
.apts{display:flex;gap:6px;flex-wrap:wrap}
.swatches{display:flex;gap:10px;margin-top:4px}
.swatches span{width:34px;height:34px;border-radius:50%;border:1px solid var(--line)}

/* ---- Itinerario: misma estructura y tipografía del formato actual (EB Garamond + Open Sans, banda gris salvia) ---- */
.docbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:816px;margin:0 auto 16px;font-size:12.5px;color:var(--ink2)}
.docbar .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.xdoc{max-width:816px;margin:0 auto;container-type:inline-size;display:flex;flex-direction:column;gap:20px}
.xpg{background:#FFFFFF;color:#222;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 28px rgba(40,40,30,.10);min-height:129.4cqw;padding:5.9cqw 5.9cqw 3.2cqw;display:flex;flex-direction:column;font-family:var(--garamond);font-size:clamp(12.5px,1.95cqw,16px);line-height:1.42;color-scheme:light}
.xpg p{margin:0 0 .7em}
.xft{margin-top:auto;padding-top:22px;display:flex;justify-content:space-between;font-family:var(--opensans);font-size:clamp(7.5px,1.15cqw,9.5px);color:#B8B8B8}
.xct{text-align:right;font-size:.82em;line-height:1.35;color:#333}
.xcover{margin-top:6cqw;aspect-ratio:600/242;background-size:cover;background-position:center 58%;max-width:100%}
.xband{background:#A3A38D;color:#fff;font-size:.9em;padding:.42em .8em}
.xcover+.xband{text-align:center}
.xttl{text-align:center;font-size:1.65em;margin-top:.45em;font-weight:400}
.xfor{text-align:center;font-size:.86em}
.xul{width:7.5cqw;height:2px;background:#A3A38D;margin:.45em auto 0}
.xsum{display:grid;grid-template-columns:minmax(0,34%) minmax(0,1fr);column-gap:7%;row-gap:1.05em;margin-top:2.2em;font-size:.93em}
.xsum .d{text-align:right}
.g{color:#8E8E7A}
.xfig{position:relative;aspect-ratio:600/242;background-size:cover;background-position:center;max-width:100%;background-color:#C9C9B9}
.xfig.tall{aspect-ratio:600/330}
.xcap{position:absolute;left:0;right:0;bottom:0;background:rgba(45,45,40,.5);color:#fff;padding:.5em .8em .55em;font-size:1.12em;line-height:1.22}
.xcap small{display:block;font-size:.66em;line-height:1.35}
.xcap i{display:block;font-size:.66em}
.xcap u{text-underline-offset:3px}
.xlib{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:linear-gradient(135deg,#D6D6C8,#B9B9A6);color:#fff}
.xlib svg{width:13cqw;height:auto;stroke:#fff;fill:none;stroke-width:1.1;opacity:.9}
.xlib span{font-family:var(--opensans);font-size:clamp(8px,1.2cqw,10px);letter-spacing:.14em;text-transform:uppercase;opacity:.95;margin-bottom:12%}
.xcols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));border-bottom:1px solid #E6E6E0}
.xcols>div{text-align:center;padding:.6em .3em .5em;border-right:1px solid #E6E6E0;min-width:0}
.xcols>div:last-child{border-right:0}
.xcols .v{font-size:.95em;color:#1f1f1f}
.xcols .v.g{color:#8E8E7A}
.xcols .l{font-family:var(--opensans);font-size:clamp(6.5px,1.05cqw,8.5px);color:#444;margin-top:.15em}
.xgrid{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:2.6em;row-gap:.25em;margin:.8em .5em .3em;font-size:.93em}
.xgrid .k{font-size:1.04em;color:#333}
.xgrid .v{font-size:.92em}
.xh{font-size:1em;color:#444;margin:.9em 0 .45em}
.xit{font-style:italic;padding-left:.8em;margin-bottom:.6em;font-size:.93em}
.xtime{text-align:center;color:#8E8E7A;margin-top:.55em;line-height:1.1}
.xtime small{display:block;font-family:var(--opensans);font-size:clamp(6.5px,1.05cqw,8.5px);color:#333;margin-top:.35em}
.xhr{border:0;border-top:1px solid #A3A38D;margin:.9em 0 .4em}
.xhr.lt{border-top-color:#DADAD3}
.xbox{background:#F0F0EC;padding:1em 1.1em .7em;margin:.6em 0 1em}
.xbox .t{font-size:1.18em;margin-bottom:.35em}
.xbox .row{padding:.48em 0;border-top:1px solid #E1E1DA;font-size:.86em}
.xbox .row:first-of-type{border-top:0}
.xbox .row.cap{text-transform:uppercase;font-size:.78em;letter-spacing:.01em}
.xsec{font-size:1.18em;margin:1em 0 .4em;padding-top:.5em;border-top:1px solid #A3A38D}
.dnote{max-width:816px;margin:16px auto 0;font-size:12px;color:var(--ink3);text-align:center}

/* ---- Pie ---- */
.foot-demo{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3);display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,90px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;z-index:60;transition:transform .25s;pointer-events:none;max-width:calc(100% - 32px);opacity:0}
.toast.on{transform:translate(-50%,0);opacity:1}

@media (max-width:1100px){.c8,.c4,.c7,.c5{grid-column:span 12}.c6{grid-column:span 12}.hero{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.team{grid-template-columns:minmax(0,1fr)}.phone{margin:0 auto}.set{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){
  body{padding-inline:16px}.top{margin-inline:-16px;padding:10px 16px}
  .tabs{margin-left:0;width:100%}.tabs button{flex:1;padding:8px 10px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:16px}.kpi:nth-child(3){padding-left:0;border-left:0}
  .today{grid-template-columns:repeat(2,minmax(0,1fr))}.today div:nth-child(3){border-left:0}.today div:nth-child(n+3){border-top:1px solid var(--line)}.today b{font-size:26px}.hero-tx{padding:22px 20px}.hero-img{min-height:220px}
  .panel{padding:16px}
  .phone{background:none;padding:0;box-shadow:none;border-radius:0;width:100%}
  .screen{border-radius:16px;height:auto;border:1px solid var(--line)}.sbar{display:none}.sbody{overflow:visible}
}

/* ---- Estilo de la web de Nomad: blanco, salvia, mayúsculas espaciadas, bordes punteados ---- */
:root{--bg:#FFFFFF;--surface:#F6F5F0;--surface2:#EEEDE6;--line:#E3E1D7;--ink:#474B3E;--ink2:#6B705D;--ink3:#9A9C8C;--sand:#D9C3AE;
  --serif:'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif;--sans:'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif}
body{font-weight:400;letter-spacing:.005em}
.top{background:#fff;padding-block:14px}
.topin{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:18px}
.tabs{background:none;padding:0;margin:0;gap:26px;justify-self:start}
.tabs button{padding:6px 0;border-radius:0;text-transform:uppercase;letter-spacing:.18em;font-size:12.5px;color:var(--ink);background:none!important;box-shadow:none!important;border-bottom:1px solid transparent}
.tabs button[aria-selected="true"]{border-bottom-color:var(--ink)}
.brand{justify-self:center}.brand img{height:58px}
.tr{justify-self:end;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.agsel{border:1px dashed var(--ink3);background:transparent}
.agsel select{text-transform:uppercase;letter-spacing:.1em;font-size:11.5px}
.lbl{font-weight:600;color:var(--accent);letter-spacing:.14em;font-size:10.5px}
.panel{border:0;border-radius:4px;background:var(--surface)}
.ph h3{text-transform:uppercase;letter-spacing:.2em;font-size:13.5px;font-weight:400;color:var(--ink)}
h1,h2,h3{font-weight:400}
.btn{background:transparent;color:var(--accent);border:1px dashed var(--accent);text-transform:uppercase;letter-spacing:.14em;font-weight:400;font-size:10.5px;padding:8px 16px}
.btn.done{border-style:solid}
.hero-img{min-height:360px;align-items:center;justify-content:center;text-align:center}
.hero-img::before{background:rgba(30,30,24,.42)}
.hero-tx{text-align:center;max-width:860px;margin:0 auto;padding:36px 24px;display:flex;flex-direction:column;align-items:center;gap:6px}
.hero-tx .lbl{color:rgba(255,255,255,.9)}
.hero-tx h1{text-transform:uppercase;letter-spacing:.17em;font-weight:400;font-size:clamp(24px,3.6vw,42px);line-height:1.35;margin-top:4px}
.hero-tx p{font-size:17px;font-weight:400;max-width:58ch;line-height:1.5}
.orn{width:22px;height:auto;fill:none;stroke:#fff;stroke-width:1.2;margin-bottom:10px}
.today{background:var(--accent);border:0}
.today div+div{border-left:1px dashed rgba(255,255,255,.35)}
.today b{color:#fff;font-weight:300}
.today span{color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.12em;font-size:10.5px}
.kpi+.kpi{border-left:1px dashed var(--ink3)}
.kpi .v{font-weight:300;color:var(--ink)}
.trip{background:#fff;border-radius:4px}
.trip .h{font-size:15px;text-transform:uppercase;letter-spacing:.1em}
.note{border-left:1px dashed var(--sand)}
.note .h{color:var(--ink2);font-weight:400}
.feed li{border-bottom-color:var(--line)}
.explain h2{font-weight:300;color:var(--ink2);font-size:30px}
.rules{border-top:1px dashed var(--ink3)}
.rule{border-bottom-style:dashed}
.rule .v{color:var(--ink2)}
.mv,.al{background:#fff}
.screen{background:var(--surface)}
.stabs{background:#fff}
.who-sel button{background:transparent;border-style:dashed}
.seg{background:transparent;border-style:dashed}
.demo{letter-spacing:.14em}
@media (max-width:900px){.topin{grid-template-columns:minmax(0,1fr)}.brand{order:-1}.tabs{justify-self:center}.tr{justify-self:center;justify-content:center}}

const dayName=d=>{const k=dayKey(d);if(k===dayKey(NOW))return'Hoy';if(k===dayKey(new Date(+NOW+24*H)))return'Mañana';return d.toLocaleDateString('es-DO',{weekday:'long',day:'numeric',month:'short',timeZone:TZ}).replace(/^./,c=>c.toUpperCase());};
const rdTime=d=>d.toLocaleTimeString('es-DO',{hour:'numeric',minute:'2-digit',timeZone:TZ}).replace(/\s/g,' ');
const rel=ms=>{const h=Math.round(Math.abs(ms)/H);const t=h<1?'menos de 1 h':h<48?h+' h':Math.round(h/24)+' días';return ms>0?'en '+t:'hace '+t;};
const paxN=t=>t.paxN||t.pax.length;
const first=n=>n.split(' ')[0];

/* ---------- Motor de avisos ---------- */
function alerts(){
  const ag=A(),st=ag.settings,out=[];
  ag.trips.forEach(t=>{
    t.segs.forEach((g,i)=>{
      const dep=new Date(g.dep);
      if(dep<=NOW)return;
      const out_=RD.includes(g.a),in_=RD.includes(g.b);
      if(out_||in_){
        const fire=new Date(+dep-st.eticketH*H),kind=out_?'salida':'entrada';
        out.push({id:`et-${t.id}-${i}`,trip:t,seg:g,dep,fire,active:fire<=NOW,lvl:'bad',k:'E-Ticket de '+kind,
          h:`Completar E-Ticket de ${kind} · ${t.name}`,s:`${paxN(t)} ${paxN(t)>1?'pasajeros':'pasajero'} · ${g.f} ${g.a}→${g.b} · ${dayName(dep).toLowerCase()} ${g.dl}`,link:true});
      }
      if(st.preOn){
        const fire=new Date(+dep-st.preH*H);
        out.push({id:`pre-${t.id}-${i}`,trip:t,seg:g,dep,fire,active:fire<=NOW,lvl:'info',k:'Antes del vuelo',
          h:`Confirmar check-in, asientos y documentos · ${t.name}`,s:`${g.f} ${g.a}→${g.b} · sale ${dayName(dep).toLowerCase()} ${g.dl} (${rel(dep-NOW)})`});
      }
    });
    if(t.passport){out.push({id:`pp-${t.id}`,trip:t,active:true,fire:NOW,dep:new Date(t.segs[0].dep),lvl:'warn',k:'Pasaporte',
      h:`Pasaporte de ${t.passport.who} vence ${t.passport.exp}`,s:'Menos de 6 meses de vigencia al regreso. Varios destinos lo exigen.'});}
    if(t.timelimit){const tl=new Date(t.timelimit);out.push({id:`tl-${t.id}`,trip:t,active:tl-NOW<48*H,fire:NOW,dep:tl,lvl:'warn',k:'Fecha límite de emisión',
      h:`Emitir reserva de ${t.name}`,s:`La reserva vence ${dayName(tl).toLowerCase()} a las ${rdTime(tl)} (${rel(tl-NOW)}).`});}
    if(t.balance){out.push({id:`bal-${t.id}`,trip:t,active:true,fire:NOW,dep:new Date(t.segs[0].dep),lvl:'warn',k:'Saldo pendiente',
      h:`${t.name}: saldo de ${money(t.balance/1000)}`,s:`Viaja ${dayName(new Date(t.segs[0].dep)).toLowerCase()}. Cobrar antes de emitir.`});}
    const last=t.segs[t.segs.length-1],arr=new Date(last.arr);
    if(RD.includes(last.b)&&dayKey(arr)===dayKey(NOW)){out.push({id:`back-${t.id}`,trip:t,active:true,fire:NOW,dep:arr,lvl:'ok',k:'Regresa hoy',
      h:`${t.name} llega hoy a ${last.b}`,s:`${last.f} · llegada ${last.al}. Buen momento para escribirle.`});}
  });
  return out;
}
function movements(dk){
  const rows=[];
  A().trips.forEach(t=>t.segs.forEach((g,i)=>{
    const dep=new Date(g.dep),arr=new Date(g.arr),inb=RD.includes(g.b)&&!RD.includes(g.a);
    if(inb){if(dayKey(arr)===dk)rows.push({t,g,i,when:arr,dir:'Llega',time:g.al});}
    else if(dayKey(dep)===dk)rows.push({t,g,i,when:dep,dir:RD.includes(g.a)?'Sale':'Conexión',time:g.dl});
  }));
  return rows.sort((a,b)=>a.when-b.when);
}
function etState(t,i){
  const al=alerts().find(a=>a.id===`et-${t.id}-${i}`),g=t.segs[i];
  if(!al)return (RD.includes(g.a)||RD.includes(g.b))&&new Date(g.dep)<=NOW?`<span class="chip ok">E-Ticket listo · en vuelo</span>`:'';
  const d=A().done[al.id];
  if(d)return`<span class="chip ok">E-Ticket listo</span>`;
  return al.active?`<span class="chip bad">E-Ticket pendiente</span>`:`<span class="chip n">E-Ticket ${rel(al.fire-NOW)}</span>`;
}

function chart(ag){
  const W=720,Hh=210,pl=44,pr=10,pt=18,pb=26,max=Math.ceil(Math.max(...ag.sales.map(s=>s[1]),ag.goal)/50)*50;
  const n=ag.sales.length,bw=(W-pl-pr)/n,y=v=>pt+(Hh-pt-pb)*(1-v/max);
  let g='';
  for(let v=0;v<=max;v+=max/4){g+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${v}k</text>`;}
  ag.sales.forEach(([m,v],i)=>{const x=pl+i*bw+bw*.22,w=bw*.56,cur=i===n-1;
    g+=`<rect class="bar${cur?' cur':''}" x="${x}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="2"/>`;
    if(cur){const p=v/9*31;g+=`<rect class="proj" x="${x}" y="${y(p)}" width="${w}" height="${y(0)-y(p)}" rx="2"/><text class="val" x="${x+w/2}" y="${y(p)-6}" text-anchor="middle">proy. ${Math.round(p)}k</text>`;}
    else g+=`<text class="val" x="${x+w/2}" y="${y(v)-6}" text-anchor="middle">${Math.round(v)}k</text>`;
    g+=`<text x="${x+w/2}" y="${Hh-8}" text-anchor="middle">${m}</text>`;});
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Ventas mensuales en miles de USD, mayo a octubre">${g}</svg>`;
}

const VIEWS={dir:vDir,eq:vEq,it:vIt,aj:vAj};
function render(){brand();VIEWS[S.view]();}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200);}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{
  S.view=b.dataset.v;
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
  document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='v-'+S.view);
  render();window.scrollTo({top:0});
}));
$('#agency').addEventListener('change',e=>{S.ag=e.target.value;S.eqWho='all';render();toast('Ahora ve '+A().name+'. Sus datos están separados.');});
document.addEventListener('click',e=>{
  const w=e.target.closest('[data-who]');if(w){S.eqWho=w.dataset.who;vEq();return;}
  const t=e.target.closest('[data-et]');if(t){S.eqTab=t.dataset.et;vEq();return;}
  const d=e.target.closest('[data-done]');if(d){const ag=A();const by=S.eqWho==='all'?Object.keys(ag.team)[1]:S.eqWho;
    ag.done[d.dataset.done]={by,at:'10:00 a. m.'};
    ag.feed.unshift(['10:00 a. m.',first(ag.team[by])+' marcó un aviso como hecho']);vEq();toast('Marcado como hecho. El resumen de '+ag.owner+' ya lo refleja.');return;}
  const s=e.target.closest('[data-set]');if(s){A().settings[s.dataset.set]=+s.dataset.val;vAj();toast('Avisos recalculados con '+s.dataset.val+' h de anticipación.');return;}
  if(e.target.id==='preOn'){A().settings.preOn=!A().settings.preOn;vAj();return;}
  if(e.target.id==='toOwner'){A().settings.toOwner=!A().settings.toOwner;vAj();return;}
});
render();

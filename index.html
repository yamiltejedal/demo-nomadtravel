<!doctype html><html lang="es"><head><meta http-equiv="Cache-Control" content="no-cache"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
<title>Nomad Travel Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style>body{margin:0}
/* Concepto: panel de asesora a la izquierda y teléfono del pasajero a la derecha; todo lo que la asesora cambia aparece al instante en el teléfono. */
:root{--bg:#F3F2EC;--surface:#FFFFFF;--surface2:#F6F6F3;--ink:#3C4033;--ink2:#6B705D;--ink3:#8D917C;--line:#E3E2D8;--dash:#A3A38D;--accent:#6B705D;--accent-ink:#FFFFFF;--accent-soft:#E9EBE0;--blush:#DBC6B3;--peach:#FEDFC0;--ok:#3F8062;--ok-soft:#DFEEE5;--warn:#B06A1E;--warn-soft:#F9E8CF;--bad:#B34D3A;--bad-soft:#F6DDD7;
--p-bg:#FFFFFF;--p-card:#F6F6F3;--p-ink:#3C4033;--p-ink2:#6B705D;--p-ink3:#A3A38D;--p-line:#E7E6DE;color-scheme:light}
.logo-d{display:none}

:root[data-theme="dark"]{--bg:#12140F;--surface:#1B1E17;--surface2:#22261D;--ink:#F2ECDF;--ink2:#BDBAA6;--ink3:#8F9080;--line:#2E3227;--dash:#5A5E4B;--accent:#C9B79C;--accent-ink:#1A1A12;--accent-soft:#2C2F23;--ok:#62C79A;--ok-soft:#183328;--warn:#EBA94F;--warn-soft:#3B2B12;--bad:#E8806B;--bad-soft:#3F201A;--p-bg:#171913;--p-card:#22261D;--p-ink:#F2ECDF;--p-ink2:#BDBAA6;--p-ink3:#7F8070;--p-line:#2E3227;color-scheme:dark}
:root[data-theme="dark"] .logo-l{display:none}:root[data-theme="dark"] .logo-d{display:block}
:root[data-theme="dark"] .wa{background:#27402B;color:#E6F4DE}
:root[data-theme="dark"] .phone{color-scheme:dark}
:root[data-theme="dark"] .pchip.ok{color:#62C79A}:root[data-theme="dark"] .pchip.warn{color:#EBA94F}:root[data-theme="dark"] .pchip.bad{color:#E8806B}
:root[data-theme="dark"] .pit .pi,:root[data-theme="dark"] .pdash .ico{color:#C9B79C}
:root[data-theme="dark"] .pbody img[src^="data"]:not(.mk){filter:brightness(1.6) saturate(.7)}
.themebtn{border:1px dashed var(--dash);background:transparent;color:var(--ink2);border-radius:99px;padding:8px 14px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.45;padding-inline:20px;padding-block:18px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
header img{height:46px;display:block}
.logo-d{display:none}
.badge{font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.tabs{display:flex;gap:6px;margin-left:auto}
.tabs button,.pill{border:1px dashed var(--dash);background:transparent;color:var(--ink2);border-radius:99px;padding:8px 16px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent)}
.intro{color:var(--ink2);max-width:70ch;margin-bottom:18px}
.fab{display:none}
@media (max-width:860px){.fab{display:block;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;border:0;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:12px 18px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{margin-left:auto}
h1{font-weight:300;font-size:26px;letter-spacing:-.005em}
.muted{color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:3px 10px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.n{background:var(--surface2);color:var(--ink2)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:9px 18px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink2);border:1px dashed var(--dash)}
.btn.sm{padding:6px 12px;font-size:11px}
.btn.danger{background:transparent;color:var(--bad);border:1px dashed var(--bad)}
.seg{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.seg:last-child{border-bottom:0}
.ico{width:38px;height:38px;border:1px dashed var(--dash);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--accent);flex:none;font-weight:600;letter-spacing:.04em}
.seg .t{font-weight:500}.seg .s{font-size:12.5px;color:var(--ink2)}
.seg>div{min-width:0}
form.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
form.add .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:13.5px;letter-spacing:0;text-transform:none;font-weight:400;width:100%}
textarea{resize:vertical;min-height:70px}
.tg{width:42px;height:24px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.tg[aria-pressed="true"]{background:var(--accent)}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.tg[aria-pressed="true"]::after{transform:translateX(18px)}
.wa{background:#E3F1D6;color:#27331f;border-radius:12px 12px 12px 3px;padding:10px 12px;font-size:13px;max-width:100%}
.q{border:1px dashed var(--dash);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.empty{color:var(--ink3);font-size:13px;padding:10px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px}
.kpi .v{font-size:28px;font-weight:300}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:14px}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:11px;color:var(--ink3)}.bars>div>span:first-child{flex:1}
.bars i{display:block;width:100%;max-width:22px;border-radius:4px 4px 0 0;background:var(--blush)}
.bars i.n{background:var(--accent)}
.note{font-size:12px;color:var(--ink3)}

/* ---- Estructura ---- */
:root{--nav:#6B705D;--navtext:#F4F1E8}
:root[data-theme="dark"]{--nav:#0C0D0A;--navtext:#F2ECDF}
.hint{color:var(--ink2);font-size:13px;flex:1;min-width:220px}
.shell{display:grid;grid-template-columns:224px minmax(0,1fr) auto;gap:24px;align-items:start}
.phonecol{position:sticky;top:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.side{background:var(--nav);color:var(--navtext);border-radius:18px;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:12px;min-height:520px;max-height:calc(100dvh - 24px)}
.side>img{height:58px;width:auto;align-self:flex-start;margin:0 0 16px 6px}
.side nav{display:flex;flex-direction:column;gap:3px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:13.5px;opacity:.82;border:0;background:none;color:inherit;text-align:left;width:100%}
.nav.on{background:rgba(255,255,255,.16);opacity:1}
.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav .n{margin-left:auto;background:var(--blush);color:#3C4033;border-radius:10px;font-size:10.5px;font-weight:700;padding:1px 7px}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:14px 6px 0;border-top:1px solid rgba(255,255,255,.18)}
.me .av{width:34px;height:34px;border-radius:50%;background:var(--blush);color:#3C4033;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.two{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:start}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600;padding:10px 16px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr.hl td{background:var(--accent-soft)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
@media (max-width:1180px){.shell{grid-template-columns:minmax(0,1fr) auto}.side{grid-column:1/-1;position:static;min-height:0;max-height:none;flex-direction:row;align-items:center;gap:10px;overflow-x:auto;padding:10px 14px}.side>img{height:44px;margin:0}.side nav{flex-direction:row}.nav{white-space:nowrap;width:auto}.me{margin:0 0 0 auto;border:0;padding:0}}
@media (max-width:860px){.shell{grid-template-columns:minmax(0,1fr)}.phonecol{position:static;order:2}.two{grid-template-columns:minmax(0,1fr)}.me{display:none}}

.ptoast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,80px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;z-index:60;transition:transform .25s;pointer-events:none}
.ptoast.on{transform:translate(-50%,0)}
.rowbtn{width:100%;border:0;background:none;color:inherit;font:inherit;border-radius:10px;padding-inline:8px;text-align:left;cursor:pointer}
.rowbtn:hover,.tbl tr.clk:hover td{background:var(--accent-soft)}
.rowbtn.sel{background:var(--accent-soft)}
.tbl tr.clk{cursor:pointer}
.pill{border:1px dashed var(--dash);background:transparent;color:var(--ink2);border-radius:99px;padding:7px 14px;font-size:12px;letter-spacing:.06em;font-weight:500}
.pill.on{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent)}
@media (prefers-reduced-motion:reduce){.ptoast{transition:none}}
/* ---- Teléfono ---- */
.pwrap{position:relative;width:calc(390px*var(--ps,1) + 20px);height:calc(844px*var(--ps,1) + 20px);flex:none}
.phone{position:absolute;left:10px;top:10px;width:390px;height:844px;transform:scale(var(--ps,1));transform-origin:top left;border-radius:46px;background:var(--p-bg);color:var(--p-ink);box-shadow:0 0 0 9px #14110D,0 0 0 10px #3a352c,0 24px 50px rgba(30,20,5,.3);overflow:hidden;display:flex;flex-direction:column;color-scheme:light}
.sbar{height:44px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 4px;font-size:13px;font-weight:600;position:relative;z-index:3}
.pbody{flex:1;overflow-y:auto;position:relative;scrollbar-width:none}
.pbody::-webkit-scrollbar{display:none}
.ptab{display:flex;height:70px;flex:none;border-top:1px solid var(--p-line);background:var(--p-bg);padding-top:8px;position:relative;z-index:3}
.ptab button{flex:1;border:0;background:none;color:var(--p-ink3);font-size:10.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.ptab button[aria-selected="true"]{color:var(--p-ink2)}
.ptab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ptab .dot{position:absolute;top:-2px;right:calc(50% - 20px);background:var(--bad);color:#fff;border-radius:9px;min-width:16px;height:16px;font-size:9.5px;display:flex;align-items:center;justify-content:center;font-weight:700}
.hero{height:210px;background-size:cover;background-position:60% 40%;position:relative;margin-top:-44px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,10,5,.5),rgba(15,10,5,0) 45%,var(--p-bg) 100%)}
.hero .mk{position:absolute;left:22px;top:54px;z-index:2;height:34px;filter:brightness(0) invert(1);opacity:.95}
.pad{padding:0 22px 22px}
.plbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--p-ink3);font-weight:600}
.ph1{font-weight:300;font-size:25px;line-height:1.2;margin:4px 0 14px}
.pcard{background:var(--p-card);border:1px solid var(--p-line);border-radius:18px;padding:16px;margin-bottom:12px}
.pdash{border:1px dashed var(--p-ink3);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.times{display:flex;align-items:center;gap:8px;margin:12px 0 4px}
.times .big{font-size:28px;font-weight:300}
.times .ln{flex:1;border-top:1px dashed var(--p-ink3);height:0}
.pchip{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:500}
.pchip.ok{background:var(--ok-soft);color:#3F8062}.pchip.warn{background:var(--warn-soft);color:#B06A1E}.pchip.bad{background:var(--bad-soft);color:#B34D3A}
.day{margin:16px 0 8px}
.pit{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--p-line)}
.pit .pi{width:38px;height:38px;border:1px dashed var(--p-ink3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--p-ink2);flex:none}
.pit .pt{font-weight:500;font-size:14px}.pit .ps{font-size:12.5px;color:var(--p-ink2)}
.pit .tm{margin-left:auto;font-size:12.5px;color:var(--p-ink2);font-variant-numeric:tabular-nums}
.pbtn{width:100%;border:0;background:var(--accent);color:#fff;border-radius:99px;padding:13px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.bub{max-width:82%;padding:9px 13px;border-radius:16px;font-size:13.5px;margin-bottom:8px}
.bub.a{background:var(--p-card);border:1px solid var(--p-line);border-bottom-left-radius:4px}
.bub.p{background:#6B705D;color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.pinput{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--p-line)}
.pinput input{border-radius:99px;background:var(--p-card);border:1px solid var(--p-line);color:var(--p-ink)}
.pinput button{border:0;background:#6B705D;color:#fff;border-radius:99px;padding:0 16px;font-size:12px;font-weight:500}
.push{position:absolute;left:12px;right:12px;top:48px;z-index:10;background:rgba(246,246,243,.97);color:#3C4033;border-radius:18px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(-140px);transition:transform .35s ease;font-size:13px}
.push.on{transform:none}
.push b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6B705D;margin-bottom:2px}
.nt{padding:13px 0;border-bottom:1px solid var(--p-line)}
.nt.new{background:linear-gradient(90deg,rgba(254,223,192,.45),transparent)}
.nt .h{font-weight:500;font-size:14px}.nt .b{font-size:13px;color:var(--p-ink2);margin-top:2px}.nt .d{font-size:11px;color:var(--p-ink3);margin-top:4px}
.draft{text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
@media (prefers-reduced-motion:reduce){.push,.tg::after{transition:none}}
</style>

<div class="wrap">
<header>
  <span class="badge">Demo interactiva · v3 multi-cliente · datos de ejemplo</span>
  <span class="hint">Lo que haga la asesora llega al instante al teléfono. Nombres, vuelos y hotel son inventados.</span>
  <div class="tabs" role="group" aria-label="Vista"><button id="vAgent" aria-pressed="true">Asesora</button><button id="vOwner" aria-pressed="false">Dueña</button></div><button class="themebtn" id="themeBtn" aria-label="Cambiar tema">Tema oscuro</button>
</header>
<div class="ptoast" id="ptoast" role="status"></div>
<button class="fab" id="fab">Ver app ↓</button>

  <div class="card"><div class="sec">Dominio</div><input value="app.nomadtravel.com.do" readonly aria-label="Dominio" style="margin-top:10px"><div class="row" style="margin-top:8px"><span class="chip ok">Activo</span><span class="note">Certificado seguro vigente</span></div></div>
  <div class="card"><div class="sec">Equipo y permisos</div>${[["Mariana R.","Asesora","Activa"],["Daniela P.","Asesora","Activa"],["Rosa M.","Asesora","Invitada"],["Dueña","Administradora","Activa"]].map(u=>`<div class="seg"><div class="ico">${u[0][0]}</div><div style="flex:1" class="t">${u[0]}</div><span class="s" style="width:130px">${u[1]}</span><span class="chip ${u[2]==="Activa"?"ok":"warn"}">${u[2]}</span></div>`).join("")}</div>
  <div class="card"><div class="sec">Seguridad y privacidad</div>${sc.map((t,i)=>`<div class="seg"><button class="tg" data-sectog="${i}" aria-pressed="${S.sec[i]}" aria-label="${t}"></button><div class="t">${t}</div></div>`).join("")}</div>`;
}
function sectionHTML(){return({panel:secPanel,clientes:secClientes,viajes:secViajes,notif:secNotif,plant:secPlant,resumen:secResumen,ajustes:secAjustes}[S.section]||secPanel)()}
function renderSide(){
  const items=SECS.filter(x=>!x[3]||S.view==="owner");
  $("#nav").innerHTML=items.map(([k,l,ic])=>`<button class="nav ${S.section===k?"on":""}" data-sec="${k}"><svg viewBox="0 0 24 24">${NI[ic]}</svg>${l}${k==="notif"&&S.queue.length?`<span class="n">${S.queue.length}</span>`:""}</button>`).join("");
  $("#me").innerHTML=`<div class="av">${S.view==="owner"?"D":"M"}</div><div><div style="font-size:13px">${S.view==="owner"?"Dueña":"Mariana R."}</div><div style="font-size:11px;opacity:.7">${S.view==="owner"?"Administradora":"Asesora"}</div></div>`;
}
function renderPanel(){const el=$("#panelcol");el.innerHTML=sectionHTML();const cl=$("#chatLog");if(cl)cl.scrollTop=cl.scrollHeight}
function render(){renderSide();renderPanel();renderPhone();
  $("#vAgent").setAttribute("aria-pressed",S.view==="agent");$("#vOwner").setAttribute("aria-pressed",S.view==="owner");
  $("#phoneCap").textContent="App de "+T().name+" · vista previa"}
function fit(){const W=innerWidth,H=innerHeight;let s=Math.min(1,(H-(W>860?150:130))/854);if(W<=860)s=Math.min(s,(W-32-20)/390);s=Math.max(.5,s);document.documentElement.style.setProperty("--ps",s.toFixed(3))}
addEventListener("resize",fit);fit();

/* ---------- Acciones ---------- */
function addNotice(i,title,body){const t=S.trips[i];t.notices.unshift({id:uid++,title,body,ts:"Ahora",unread:!(i===S.cur&&S.tab==="av")});S.sentCount++;
  if(i===S.cur)pushToast(title,body);else ptoast("Aviso enviado a "+t.name)}
function applyFlight(i,d,g,st){
  const t=S.trips[i],f=t.flight;
  const status=st==="cancel"?"cancel":(d>0?"delay":"ok");
  if(d===f.delay&&g===f.gate&&status===f.status)return false;
  let title,msg;
  if(status==="cancel"){title="Vuelo cancelado";msg=`${t.first[0].toUpperCase()+t.first.slice(1)}, lamentamos avisarte que el vuelo ${f.code} fue cancelado. Mariana te llamará en unos minutos con alternativas.`}
  else if(status==="delay"){title="Retraso de vuelo";msg=`Hola ${t.first}, tu vuelo ${f.code} tiene un retraso de ${d} min. Nueva salida: ${fmt(f.dep+d)}. Mariana está al tanto.`}
  else if(g!==f.gate){title="Cambio de puerta";msg=`${t.first[0].toUpperCase()+t.first.slice(1)}, tu vuelo ${f.code} saldrá ahora por la puerta ${g}.`}
  else{title="Vuelo a tiempo";msg=`Tu vuelo ${f.code} vuelve a salir a su hora original.`}
  const item={id:uid++,trip:i,kind:status,title,msg,apply:()=>{f.delay=status==="delay"?d:0;f.gate=g;f.status=status}};
  if(S.supervised){S.queue.push(item)}else{item.apply();addNotice(i,title,msg)}
  return true;
}
function simulate(kind){
  const t=T(),f=t.flight;
  if(kind==="reset"){f.delay=0;f.gate=f.gate;f.status="ok";S.queue=S.queue.filter(q=>q.trip!==S.cur);render();return}
  if(kind==="delay")applyFlight(S.cur,120,f.gate,"delay");
  if(kind==="gate")applyFlight(S.cur,f.delay,f.gate==="B12"?"B7":"B12",f.status);
  if(kind==="cancel")applyFlight(S.cur,f.delay,f.gate,"cancel");
  render();
}
function selectTrip(i){S.cur=i;S.tab="home";S.editing=null}
document.addEventListener("click",e=>{
  const tr=e.target.closest("tr[data-trip]");
  const t=e.target.closest("button")||tr;if(!t)return;
  if(t.id==="vAgent"){S.view="agent";if(["resumen","ajustes"].includes(S.section))S.section="panel";render()}
  else if(t.id==="vOwner"){S.view="owner";render()}
  else if(t.id==="themeBtn"){setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark")}
  else if(t.id==="fab"){const toApp=t.textContent.includes("app");if(toApp){document.querySelector(".phonecol").scrollIntoView({behavior:"smooth",block:"start"});t.textContent="Ver panel ↑"}else{window.scrollTo({top:0,behavior:"smooth"});t.textContent="Ver app ↓"}}
  else if(t.dataset.trip!==undefined){selectTrip(+t.dataset.trip);if(t.dataset.sec)S.section=t.dataset.sec;render()}
  else if(t.dataset.sec){S.section=t.dataset.sec;S.editing=null;render();window.scrollTo({top:0})}
  else if(t.dataset.rule!==undefined){S.rules[+t.dataset.rule].on=!S.rules[+t.dataset.rule].on;render()}
  else if(t.dataset.sectog!==undefined){S.sec[+t.dataset.sectog]=!S.sec[+t.dataset.sectog];render()}
  else if(t.dataset.edit){S.editing=+t.dataset.edit;render()}
  else if(t.dataset.canceledit){S.editing=null;render()}
  else if(t.id==="tgPub"){T().published=!T().published;render()}
  else if(t.id==="tgSup"){S.supervised=!S.supervised;render()}
  else if(t.dataset.del){T().segs=T().segs.filter(s=>s.id!=t.dataset.del);render()}
  else if(t.dataset.sim){simulate(t.dataset.sim)}
  else if(t.dataset.ok){const q=S.queue.find(x=>x.id==t.dataset.ok);if(!q)return;const ta=document.querySelector(`textarea[data-q="${q.id}"]`);const msg=ta?ta.value:q.msg;q.apply();S.queue=S.queue.filter(x=>x!==q);addNotice(q.trip,q.title,msg);render()}
  else if(t.dataset.no){S.queue=S.queue.filter(x=>x.id!=t.dataset.no);render()}
  else if(t.dataset.tab){S.tab=t.dataset.tab;renderPhone()}
  else if(t.dataset.go){S.tab=t.dataset.go;renderPhone()}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("tr[data-trip]")){e.preventDefault();selectTrip(+e.target.dataset.trip);render()}});
document.addEventListener("submit",e=>{
  e.preventDefault();const t=T();
  if(e.target.id==="addForm"){const title=$("#fTitle").value.trim();if(!title)return;t.segs.push({id:uid++,type:$("#fType").value,title,sub:$("#fSub").value.trim(),day:+$("#fDay").value,time:$("#fTime").value||"10:00"});addNotice(S.cur,"Itinerario actualizado","Se añadió: "+title);render()}
  else if(e.target.id==="editForm"){const s=t.segs.find(x=>x.id===+e.target.dataset.id);if(!s)return;s.type=$("#eType").value;s.day=+$("#eDay").value;s.time=$("#eTime").value||s.time;s.title=$("#eTitle").value.trim()||s.title;s.sub=$("#eSub").value.trim();
    if(s.main){const dur=t.flight.arr-t.flight.dep;t.flight.dep=toMin(s.time);t.flight.arr=t.flight.dep+dur}
    S.editing=null;addNotice(S.cur,"Itinerario actualizado","Se modificó: "+s.title);render()}
  else if(e.target.id==="flightForm"){const f=t.flight;const d=Math.max(0,parseInt($("#ffDelay").value,10)||0),g=$("#ffGate").value.trim()||f.gate,st=$("#ffStatus").value;applyFlight(S.cur,d,g,st);render()}
  else if(e.target.id==="agentChat"){const v=$("#agIn").value.trim();if(!v)return;t.chat.push({from:"a",text:v,ts:"Ahora"});pushToast("Mariana",v);render()}
  else if(e.target.id==="chatForm"){const v=$("#chatIn").value.trim();if(!v)return;t.chat.push({from:"p",text:v,ts:"Ahora"});renderPhone();renderPanel()}
});
function setTheme(t){document.documentElement.dataset.theme=t;const b=$("#themeBtn");if(b)b.textContent=t==="dark"?"Tema claro":"Tema oscuro";try{localStorage.setItem("ntv-theme",t)}catch(e){}}
let th="light";try{th=localStorage.getItem("ntv-theme")||"light"}catch(e){}
setTheme(th);
render();
</script>
</body></html>
